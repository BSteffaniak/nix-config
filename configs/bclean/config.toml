# bclean (disk usage analyzer, cleaner, and monitor), shared by every host.
# Per-host additions go in `myConfig.development.bclean.settings`.

# Rust build output counts as unused once its project has been idle for 12 hours
# (bclean's built-in default is 30 days).
[rules.cargo_target]
stale = { project_idle = "12h" }

# Trim every Rust project instead of running `cargo clean`: cargo_target's built-in keep
# patterns keep the release executables and dynamic libraries (also under target-triple
# folders such as aarch64-apple-darwin/release); everything else goes, debug builds included.
[trim]
paths = ["**"]
