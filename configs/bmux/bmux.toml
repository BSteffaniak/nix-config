# ---------------------------------------------------------------------------
# Server gateway
# ---------------------------------------------------------------------------
[server.gateway]
enabled = true
listen = "0.0.0.0:7443"
quick = true

# ---------------------------------------------------------------------------
# Scrollback
# ---------------------------------------------------------------------------
[behavior.scrollback]
mode = "frozen"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[plugins.settings."bmux.theme"]
# Keep performance diagnostics and mode-aware colors as the stable base, while
# stacking the snake decoration component pack across all panes.
appearance_themes = ["performance", "mode-aware"]
component_themes  = ["performance", "rainbow-snake"]
persistence       = "persist_between_connects"

[plugins.settings."bmux.theme".component_targets]
"performance.*" = { kind = "all-panes" }
"snake"         = { kind = "all-panes" }

[plugins.settings."bmux.theme".components.snake]
above = ["performance.border"]
below = ["performance.header"]

[composition]
active_profile = "zellij_compat"

# Personal bindings migrated from the former modal bmux configuration. Keep
# these local rather than expanding the canonical zellij_compat profile.
[keybindings.modes.insert.bindings]
"ctrl+a ("           = "plugin:bmux.windows:prev-window"
"ctrl+a )"           = "plugin:bmux.windows:next-window"
"ctrl+a ;"           = "plugin:bmux.windows:next-window"
"ctrl+a ?"           = "show_help"
"ctrl+a minus"       = "decrease_split"
"ctrl+a plus"        = "increase_split"
"ctrl+a q"           = "quit"
"ctrl+a s"           = "plugin:bmux.windows:next-window"
"ctrl+a shift+c"     = "plugin:bmux.sessions:new-session"
"ctrl+a shift+down"  = "resize_down"
"ctrl+a shift+h"     = "resize_left"
"ctrl+a shift+j"     = "resize_down"
"ctrl+a shift+k"     = "resize_up"
"ctrl+a shift+l"     = "resize_right"
"ctrl+a shift+left"  = "resize_left"
"ctrl+a shift+r"     = "plugin:bmux.windows:restart-pane"
"ctrl+a shift+right" = "resize_right"
"ctrl+a shift+up"    = "resize_up"
"ctrl+a w"           = "plugin:bmux.windows:last-window"
"ctrl+a x"           = "plugin:bmux.windows:close-active-pane"

[keybindings.global]
"alt+1"      = "plugin:bmux.windows:goto-window 1"
"alt+2"      = "plugin:bmux.windows:goto-window 2"
"alt+3"      = "plugin:bmux.windows:goto-window 3"
"alt+4"      = "plugin:bmux.windows:goto-window 4"
"alt+5"      = "plugin:bmux.windows:goto-window 5"
"alt+6"      = "plugin:bmux.windows:goto-window 6"
"alt+7"      = "plugin:bmux.windows:goto-window 7"
"alt+8"      = "plugin:bmux.windows:goto-window 8"
"alt+9"      = "plugin:bmux.windows:goto-window 9"
"alt+0"      = "plugin:bmux.windows:goto-window 10"
"ctrl+h"     = "plugin:bmux.windows:prev-window"
"ctrl+j"     = "plugin:bmux.windows:prev-window"
"ctrl+left"  = "plugin:bmux.windows:prev-window"
"ctrl+s"     = "plugin:bmux.windows:next-window"
"ctrl+right" = "plugin:bmux.windows:next-window"
"ctrl+l"     = "plugin:bmux.windows:last-window"
"alt+left"   = "focus_left_pane"
"alt+down"   = "focus_down_pane"
"alt+up"     = "focus_up_pane"
"alt+right"  = "focus_right_pane"
"ctrl+k"     = "focus_previous_pane"
"ctrl+t"     = "focus_previous_pane"
"alt+t"      = "focus_next_pane"
"alt+plus"   = "increase_split"
"alt+="      = "increase_split"
"alt+minus"  = "decrease_split"
"ctrl+alt+r" = "plugin:bmux.prompted_actions:run recording-cut"

[keybindings.scroll]
"escape" = "exit_scroll_mode"
"ctrl+c" = "exit_scroll_mode"
"j" = "scroll_down_line"
"down" = "scroll_down_line"
"k" = "scroll_up_line"
"up" = "scroll_up_line"
"h" = "scroll_up_page"
"left" = "scroll_up_page"
"page_up" = "scroll_up_page"
"ctrl+b" = "scroll_up_page"
"l" = "scroll_down_page"
"right" = "scroll_down_page"
"page_down" = "scroll_down_page"
"g" = "scroll_top"
"shift+g" = "scroll_bottom"
"v" = "begin_selection"
"y" = "copy_scrollback"
"enter" = "confirm_scrollback"

# ---------------------------------------------------------------------------
# Mouse behavior
# ---------------------------------------------------------------------------
[behavior.mouse]
focus_on_hover = true

# ---------------------------------------------------------------------------
# Recording defaults
# ---------------------------------------------------------------------------
[recording]
# Keep the most recent 5 minutes available for on-demand cuts.
# Rolling recording is enabled by default; this is the only rolling setting
# needed unless you want to change capture categories.
rolling_window_secs = 300

# Include rich data in rolling captures beyond the default input/output/events.
rolling_capture_protocol_replies = true
rolling_capture_images = true

# Write user-facing GIF exports here. Setting this also enables auto-export.
auto_export_dir = "~/bmux-recordings"

# Default GIF frame rate for recording exports and prompted cuts.
[recording.export]
fps = 24

# ---------------------------------------------------------------------------
# Prompted Actions plugin settings
# ---------------------------------------------------------------------------
[plugins.settings."bmux.prompted_actions"]

[[plugins.settings."bmux.prompted_actions".actions]]
name = "recording-cut"
command = "plugin:bmux.recording:recording-cut --last-seconds {seconds} --export-fps {fps}"

[[plugins.settings."bmux.prompted_actions".actions.prompts]]
key = "seconds"
type = "text"
title = "Cut Recording"
placeholder = "last N seconds"
validation = "positive_integer"

[[plugins.settings."bmux.prompted_actions".actions.prompts]]
key = "fps"
type = "text"
title = "GIF Frame Rate"
placeholder = "24"
default = "24"
validation = "positive_integer"

# ---------------------------------------------------------------------------
# Clipboard remote sync diagnostics
# ---------------------------------------------------------------------------
[diagnostics.components."clipboard.remote_sync"]
min_level = "debug"
