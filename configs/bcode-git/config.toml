# Shared bcode git settings.
#
# Same schema as ~/.config/bcode-git/config.toml; home/modules/development/bcode.nix nests it
# under [plugins.config."bcode.git".ui] in the generated bcode.toml. Values equal to bcode git's
# defaults (diff line wrapping, 72-column commit body wrap, 33% side panel, flexible main split)
# are omitted.
#
# Validate with scripts/check-bcode-git-config.sh.

[commit]
skip_hook_prefix = "WIP"

[files]
tree = false

[files.line_counts]
floating = true

[keybindings."git.branches"]
"shift+n" = "bcode.git.branches.new"

[keybindings."git.commits"]
# Keep "n" for navigation rather than new-branch; "t" remains revert in this panel.
n = "none"
"ctrl+t" = "bcode.git.commits.tag"
"shift+n" = "bcode.git.commits.move-up"
"shift+s" = "bcode.git.commits.squash"
"shift+t" = "bcode.git.commits.move-down"

[keybindings."git.files"]
"ctrl+s" = "bcode.git.files.stash-menu"
"shift+s" = "bcode.git.files.stash"

[keybindings."git.global"]
"ctrl+d" = "bcode.git.global.scroll-main-down"
"ctrl+e" = "bcode.git.global.diffing-menu"
"ctrl+u" = "bcode.git.global.scroll-main-up"
pagedown = "bcode.git.global.scroll-main-down"
pageup = "bcode.git.global.scroll-main-up"
right = "bcode.git.global.next-panel"
s = "bcode.git.global.next-panel"
"shift+j" = "bcode.git.global.scroll-main-down"
"shift+k" = "bcode.git.global.scroll-main-up"
"shift+w" = "bcode.git.global.diffing-menu"
"shift+z" = "bcode.git.global.redo"
tab = "bcode.git.global.next-panel"

[keybindings."git.list"]
down = "bcode.git.list.down"
n = "bcode.git.list.up"
t = "bcode.git.list.down"
up = "bcode.git.list.up"

[keybindings."git.main"]
down = "bcode.git.main.line-down"
n = "bcode.git.main.line-up"
t = "bcode.git.main.line-down"
up = "bcode.git.main.line-up"

[keybindings."git.menu"]
down = "bcode.git.menu.down"
n = "bcode.git.menu.up"
t = "bcode.git.menu.down"
up = "bcode.git.menu.up"

[keybindings."git.remotes"]
"shift+n" = "bcode.git.remotes.new"

[keybindings."git.staging"]
down = "bcode.git.staging.line-down"
n = "bcode.git.staging.line-up"
t = "bcode.git.staging.line-down"
up = "bcode.git.staging.line-up"

[keybindings."git.stash"]
"shift+n" = "bcode.git.stash.branch"

[keybindings."git.tags"]
"shift+n" = "bcode.git.tags.new"

[keybindings."git.worktrees"]
"shift+n" = "bcode.git.worktrees.new"

[layout]
expand_focused = false
expanded_weight = 2
screen_mode = "half"

[layout.command_log]
show = true

[refresh]
auto_fetch_seconds = 60
poll_seconds = 0

[staging]
hunk_mode = true
